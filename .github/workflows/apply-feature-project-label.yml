name: Apply feature project label

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write

jobs:
  apply-project-label:
    if: contains(github.event.issue.body, '### Project')
    runs-on: ubuntu-latest
    steps:
      - name: Apply selected project label
        uses: actions/github-script@v7
        with:
          script: |
            const projectLabels = [
              'Attribute PvP Helper Reforged',
              'HM Basic Play',
              'HM Life+',
              'HMT Pack',
              'HMTAPI',
              'HMTSync',
              'JS Combat Pro',
              'JS Green Ores / JS Cyan Ores',
              'JS Performance Core',
              'JS Removed Crosshair'
            ];

            const body = context.payload.issue.body || '';
            const projectMatch = body.match(/### Project\s*\n+([^\n]+)/);
            if (!projectMatch) {
              return;
            }

            const selectedProject = projectMatch[1].trim();
            const currentLabels = context.payload.issue.labels.map(label => label.name);
            const labelsToKeep = currentLabels.filter(label => !projectLabels.includes(label));

            if (projectLabels.includes(selectedProject)) {
              labelsToKeep.push(selectedProject);
            }

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labelsToKeep
            });
